# picapture tuning, written by the debug UI.
#
# Anything absent falls back to the compiled-in default, so it is
# safe to delete a line you have not deliberately changed - and
# safer than keeping a stale copy of a value somebody has since
# improved in the source.
#
# Listing ANY brand replaces the whole built-in list, so all four
# have to appear together. Their order is the order counts are
# reported in, and it must match catalogue::Can on the RP2040.
#
#   name | wire key | hue,saturation,value | can area
#
# The colour is a single point, not a range: a pixel goes to
# whichever drink's colour it is nearest. Hue is 0-179, not
# 0-359 - OpenCV halves it to fit a byte.
#
# The can area is the size of ONE can in pixels, and is what lets
# two touching cans be counted as two rather than as one blob.
# Zero means uncalibrated: press 'c' with one can in view.

brand = Coke | coke | 0,255,191 | 6350
brand = Fanta | fanta | 7,255,211 | 6915
brand = Mountain Dew | mtndew | 37,232,129 | 6557
brand = Solo | solo | 24,255,209 | 6270

# Classification. Hue identifies the drink; saturation and value
# mostly describe the lighting, so they are weighted well below it.
hue_weight = 4
sat_weight = 0.5
val_weight = 0.25
max_brand_dist = 60

# What counts as a drink at all, rather than shelf or shadow.
# Global on purpose: these must never decide WHICH drink.
min_saturation = 90
min_value = 50

# Mask cleanup
open_kernel = 3
close_kernel = 3
contour_min_area = 2540
contour_max_area = 16216
flat_field_blur = 51

# Camera
capture_width = 800
capture_height = 600
process_width = 400
process_height = 300
rotate_180 = false
period_ms = 250
# Appended to libcamerasrc verbatim. Chiefly for locking exposure
# and white balance - see `gst-inspect-1.0 libcamerasrc`.
libcamerasrc_extra = awb-mode=daylight
